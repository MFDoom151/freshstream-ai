name: CI/CD Pipeline — FreshStream AI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify-and-build:
    name: Lint, Type-Check, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client & Migrate
        run: |
          npx prisma generate
          npx prisma migrate dev --name init || npx prisma db push

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript Static Type-Check
        run: npx tsc --noEmit

      - name: Execute Full E2E Test Suite
        run: node scripts/run-e2e-tests.mjs

      - name: Production Next.js Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          DATABASE_URL: file:./dev.db
          NEXTAUTH_SECRET: ci-testing-secret-must-be-at-least-32-chars-long

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Web Application Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: freshstream-web:latest

      - name: Build IoT Stream Emulator Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.emulator
          push: false
          tags: freshstream-emulator:latest

      - name: Build Telegram Bot Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./tg-bot
          file: ./tg-bot/Dockerfile
          push: false
          tags: freshstream-tg-bot:latest
