  #         type: web
  #         name: freshstream-web
  #         property: host
  #     - key: INTERVAL_MS
  #       value: "2000"
  #     - key: SHIPMENT_ID
  #       value: "FS-8821"

  # ── 3. (Optional) Telegram AI Conductor Alert Bot (Background Worker) ──
  # Uncomment below if running on a paid plan:
  #
  # - type: worker
  #   name: freshstream-tg-bot
  #   env: docker
  #   plan: starter
  #   dockerfilePath: ./tg-bot/Dockerfile
  #   dockerContext: ./tg-bot
  #   autoDeploy: true
  #   envVars:
